packages:
  - apps/*
  - packages/*
  # Browser end-to-end tests: a dev-only package, never part of a runtime image.
  - e2e

# pnpm 10 blocks dependency install scripts unless they are listed here.
onlyBuiltDependencies:
  - "@prisma/engines"
  - "@tailwindcss/oxide"
  - esbuild
  - prisma
  - sharp
  - unrs-resolver
