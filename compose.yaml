# One-command start (T232; T101 extends it): `docker compose up --build`, nothing else.
#
# Start order: postgres and redis (both healthchecked) → migrate (migrations and seed, then exits)
# and, beside it, the sandbox → api and worker, once the sandbox listens (they send it files, CRM
# records, and messages) → web, once the api answers its health check (every page reads its brand
# from the api, T349). The sandbox waits only for postgres (its records live in the `sandbox`
# schema). Every server listens on 0.0.0.0 inside its container. migrate must not run before the
# database accepts connections, and the worker needs Redis for its delivery queue.
#
# Memory (T391): the whole stack must fit a 2 GB machine. Postgres and Redis are capped by their
# settings; each Node service gets a V8 heap cap (NODE_OPTIONS), because Node's default grows with
# the machine's memory and four defaults together exceed 2 GB. The caps sit well above what each
# service was measured to use, so they make V8 collect sooner rather than run out.
#
# Redis carries the outbox deliveries for the worker (T339; constitution XVIII). It keeps no data
# (no snapshots, no append-only file) and never evicts: the deliveries' state is in PostgreSQL, and
# the worker's relay re-queues anything Redis loses.
#
# Settings come from the committed .env file. It holds demo values only and needs no secrets
# or outside accounts.
#
# Published ports: web 3000 (open http://localhost:3000), api 4000, sandbox 4100.

name: investor-platform

services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=50"]
    environment:
      # Must match DATABASE_URL in .env.
      POSTGRES_USER: clever
      POSTGRES_PASSWORD: clever-demo
      POSTGRES_DB: investor_platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clever -d investor_platform"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--maxmemory",
        "64mb",
        "--maxmemory-policy",
        "noeviction",
        "--save",
        "",
        "--appendonly",
        "no",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  sandbox:
    build:
      context: .
      target: sandbox
    image: investor-platform-sandbox:local
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Measured at about 35 MiB resident under load; uploaded bytes are Buffers, outside this cap.
      NODE_OPTIONS: --max-old-space-size=128
    ports:
      - "4100:4100"
    volumes:
      - sandbox-objects:/data/sandbox-objects
    # It listens only once its schema exists, so an open port means ready. No health route is
    # needed: Node opens a connection to the port.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('node:net').connect(4100, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrate
    image: investor-platform-migrate:local
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    image: investor-platform-api:local
    # .env.local is optional and never committed: it can switch storage to S3 with your own bucket
    # and AWS keys (README, "Using S3"). Without it, everything runs on the sandbox.
    env_file:
      - .env
      - path: .env.local
        required: false
    environment:
      # Measured at about 150 MiB resident under concurrent page loads.
      NODE_OPTIONS: --max-old-space-size=256
    depends_on:
      migrate:
        condition: service_completed_successfully
      sandbox:
        condition: service_healthy
    ports:
      - "4000:4000"
    # The image has no curl; Node's fetch asks the api's own health route.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 20
      # A slow first start on a small machine is not a failure.
      start_period: 60s
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    image: investor-platform-worker:local
    # The worker reads uploaded files (the investor import), so it gets the api's storage choice.
    env_file:
      - .env
      - path: .env.local
        required: false
    environment:
      # Only the worker uses Redis; the api never does (Sprint 6 decisions in tasks.md).
      REDIS_URL: redis://redis:6379
      # Parsing an investor file at the 5 MB cap alone holds about 120 MiB of live heap.
      NODE_OPTIONS: --max-old-space-size=384
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    image: investor-platform-web:local
    env_file: .env
    environment:
      # Measured at about 290 MiB resident under concurrent page loads.
      NODE_OPTIONS: --max-old-space-size=384
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
  sandbox-objects:
