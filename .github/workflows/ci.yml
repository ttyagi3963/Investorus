# Baseline CI (T229; T411 adds e2e). Every pull request and every push to main runs five jobs,
# each its own check: lint-typecheck, unit-tests, integration-tests, e2e, and security. Merge only
# when all five are green; the free private plan has no rulesets, so this is a convention, not
# enforced.
#
# Third-party actions are pinned to full commit SHAs (the tag is in the comment beside each).
# No secrets are used.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One run per PR (or per branch for pushes). A new push to a PR cancels its stale run; runs on
  # main are never cancelled, so every commit on the trunk keeps its own result.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  lint-typecheck:
    name: lint-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node, pnpm, and dependencies
        uses: ./.github/actions/setup

      - name: Lint (ESLint, including boundary and jsx-a11y rules)
        run: pnpm lint

      - name: Formatting (Prettier)
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node, pnpm, and dependencies
        uses: ./.github/actions/setup

      # Offline by design (constitution XV): no database, network, or containers.
      - name: Unit tests
        run: pnpm test

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Shadow database for the migration drift check. The integration tests themselves start
      # their own throwaway containers through Testcontainers.
      shadow-db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shadow
          POSTGRES_PASSWORD: shadow
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shadow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SHADOW_DATABASE_URL: postgresql://shadow:shadow@localhost:5432/shadow
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node, pnpm, and dependencies
        uses: ./.github/actions/setup

      - name: Prisma validate and migration drift check
        run: pnpm db:check

      - name: Integration tests (*.int.test.ts, Testcontainers)
        run: pnpm test:integration

  # The critical journeys in a real browser (T411): the whole stack exactly as the reviewer starts
  # it, then Playwright's Chromium, installed here and only here (the images never get a browser).
  # The run takes about 8 minutes on top of the cold image build: one CRM-outage test must wait
  # out the worker's ten delivery attempts (about 5 minutes) while the other specs run beside it.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node, pnpm, and dependencies
        uses: ./.github/actions/setup

      - name: Install Chromium for Playwright (CI only)
        run: pnpm --filter @clever/e2e exec playwright install --with-deps chromium

      - name: Start the stack (docker compose up --build)
        run: docker compose up --build --detach

      - name: Wait for the api and the web app
        run: |
          sh scripts/wait-for-home.sh http://localhost:4000/api/v1/health 600
          sh scripts/wait-for-home.sh http://localhost:3000/ 300

      - name: Browser end-to-end tests
        run: pnpm test:e2e

      - name: Save the stack's logs
        if: failure()
        run: |
          mkdir -p e2e/test-results
          docker compose logs --no-color > e2e/test-results/compose.log 2>&1 || true

      - name: Upload the Playwright report, traces, and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out (full history, for the commit range)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks 8.30.1 (checksum verified)
        run: |
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # A PR scans its own commits; a push to main scans the pushed commits (or the whole history
      # when there is no earlier commit). Accepted findings are listed in .gitleaksignore.
      - name: Secret scan (gitleaks)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range=""
          else
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          echo "Scanning commits: ${range:-full history}"
          gitleaks git . --log-opts="$range" --redact --no-banner --verbose

      - name: Set up Node, pnpm, and dependencies
        uses: ./.github/actions/setup

      # Advisory only: known vulnerabilities are reported in the job summary but do not block the
      # merge. Dependabot (T234) opens the update PRs.
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: |
          status=0
          pnpm audit --audit-level high > audit.txt 2>&1 || status=$?
          cat audit.txt
          {
            echo "## pnpm audit (advisory)"
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then echo "::warning title=pnpm audit::High or critical advisories found (advisory, not blocking)."; fi
          exit "$status"
