name: Set up Node, pnpm, and dependencies
description: >
  Installs pnpm (the version in package.json "packageManager"), Node 24 with the pnpm store
  cached between runs, and the workspace dependencies from the lockfile, unchanged.

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Install Node 24 (pnpm store cached)
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"
        cache: pnpm

    - name: Install dependencies (frozen lockfile)
      shell: bash
      run: pnpm install --frozen-lockfile
