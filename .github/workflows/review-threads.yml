# Review threads check (T231). Fails while any review thread on the pull request is unresolved,
# including the Claude review's inline comments.
#
# This repository is private on a free GitHub plan, which does not offer rulesets or branch
# protection, so GitHub cannot block a merge. This check makes the state visible instead: do
# not merge while it is red.
#
# GitHub does not start workflows when a thread is resolved. After resolving threads, re-run
# this check from the PR's Checks tab (or push a commit) to turn it green.

name: Review threads

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions:
  contents: read

concurrency:
  group: review-threads-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  threads:
    name: review-threads
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Count unresolved review threads
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api graphql \
            -F owner="${REPO%/*}" -F name="${REPO#*/}" -F pr="$PR" \
            -f query='
              query($owner: String!, $name: String!, $pr: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $pr) {
                    reviewThreads(first: 100) {
                      nodes {
                        isResolved
                        isOutdated
                        path
                        line
                        comments(first: 1) { nodes { author { login } url } }
                      }
                    }
                  }
                }
              }' > threads.json

          open=$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved | not)] | length' threads.json)
          total=$(jq '.data.repository.pullRequest.reviewThreads.nodes | length' threads.json)

          {
            echo "## Review threads: $open unresolved of $total"
            jq -r '.data.repository.pullRequest.reviewThreads.nodes[]
              | select(.isResolved | not)
              | "- \(.path):\(.line // "file") by \(.comments.nodes[0].author.login)\(if .isOutdated then " (outdated)" else "" end): \(.comments.nodes[0].url)"' threads.json
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$open" -gt 0 ]; then
            echo "::error title=Unresolved review threads::$open of $total review threads are unresolved. Resolve them, then re-run this check."
            exit 1
          fi
          echo "All $total review threads are resolved."
